# Generated into build/generated/sources/modMetadata by the generateModMetadata task (see build.gradle).
# Format reference: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="cinecreate_logo.png"
authors="JS_ON"
credits="Scene engine and add-on API: Cinematic Interactions by Southware. Machines: Create by simibubi and the Creators of Create."

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.255,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# Newer versions are accepted: if one lacks something we use, CiHooks / CiApi turn the scenes off and Create keeps its clicks
[[dependencies.${mod_id}]]
    modId="cinematic"
    type="required"
    versionRange="[${cinematic_version},)"
    ordering="AFTER"
    side="BOTH"
