# Generated into build/generated/sources/modMetadata by the generateModMetadata task (see build.gradle).
# Format reference: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="Minechestplate"
credits="Scene engine and add-on API: Cinematic Interactions by Southware. Machines: Create by simibubi and the Creators of Create."
description='''
Cinematic Interactions scenes for Create machines: load a depot under the press by hand, fill the mechanical crafters, turn the valve handle.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.255,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# The add-on API is a preview that may change between releases: widen the range only after testing a new one
[[dependencies.${mod_id}]]
    modId="cinematic"
    type="required"
    versionRange="[${cinematic_version},0.19)"
    ordering="AFTER"
    side="BOTH"
